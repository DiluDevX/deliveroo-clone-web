name: CI/CD - Development Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "terraform/**"
      - ".github/workflows/terraform-check.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-development:
    name: Release to Development
    uses: ./.github/workflows/deploy-to-azure-static-web-apps.yml
    with:
      environment: development
    secrets: inherit
