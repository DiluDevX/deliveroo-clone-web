name: Extract Version

on:
  workflow_call:
    outputs:
      version:
        description: "The version tag without 'v' prefix"
        value: ${{ jobs.extract.outputs.version }}
      published:
        description: "Whether a new version was published"
        value: ${{ jobs.extract.outputs.published }}

jobs:
  extract:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      published: ${{ steps.extract.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract
        run: |
          git fetch --tags

          TAG=$(git tag --sort=-creatordate | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No tags found"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_DATE=$(git log -1 --format="%ct" "$TAG")
          NOW=$(date +%s)
          DIFF=$((NOW - TAG_DATE))

          if [ "$DIFF" -ge 300 ]; then
            echo "No new release in this run"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=${TAG#v}

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Found tag: $TAG"
