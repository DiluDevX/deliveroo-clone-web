name: Deploy Deliveroo-clone-web to Azure VM

on:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: deploy-deliveroo-clone-web-main
  cancel-in-progress: true

env:
  IMAGE_NAME: deliveroo-clone-web

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set image tags
        id: image
        run: |
          echo "sha_tag=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_BFF_API_KEY=${{ secrets.VITE_BFF_API_KEY }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_BYPASS_AUTH=false

      - name: Deploy on Azure VM
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          IMAGE_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/azure_vm_key
          chmod 600 ~/.ssh/azure_vm_key
          ssh-keyscan -H "$AZURE_VM_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/azure_vm_key "$AZURE_VM_USER@$AZURE_VM_HOST" \
            ACR_LOGIN_SERVER="$ACR_LOGIN_SERVER" \
            ACR_USERNAME="$ACR_USERNAME" \
            ACR_PASSWORD="$ACR_PASSWORD" \
            IMAGE_TAG="$IMAGE_TAG" \
            'bash -s' <<'REMOTE_SCRIPT'
            set -euo pipefail

            echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" \
              --password-stdin

            docker pull "$IMAGE_TAG"
            docker stop deliveroo-clone-web || true
            docker rm deliveroo-clone-web || true
            docker run -d \
              --name deliveroo-clone-web \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE_TAG"

            docker image prune -f
          REMOTE_SCRIPT
